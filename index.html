<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dyer AI Lesson 01 — вопросы коллег">
</head>
<body>
<title>Dyer AI Lesson 01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@200;300;400;500&display=swap">
<style>
/* One deliberate look: Dyer white page, dark-grey text, Dyer blue line drawings.
   Full-screen slides; one complete wheel stroke = next slide. */
:root {
  --bg: #ffffff;
  --text: #3c4048;
  --muted: #8a9099;
  --line: #e3e8ef;
  --blue: #163F79;
  --deep: #0f2d57;
  --tint: #eef2f8;
  --hair: #c9d6ea;
  --font: "Commissioner", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.77,0,.18,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 300 16px/1.5 var(--font);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
svg * { transform-box: fill-box; transform-origin: center; }

/* ---------- slides ---------- */
.viewport { position: fixed; inset: 0; overflow: hidden; }
.track { height: 100%; transition: transform 1s var(--ease); will-change: transform; }
.slide {
  height: 100%;
  position: relative;
  display: grid;
  align-items: center;
  padding-block: 76px 140px;
  padding-left: max(96px, env(safe-area-inset-left, 0px));
  padding-right: max(96px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
.slide > * { transition: opacity .7s ease .2s, transform .9s var(--ease) .1s; }
.slide:not(.is-active) > * { opacity: 0; transform: translateY(24px); }
.slide:not(.is-active) * { animation-play-state: paused !important; }

/* ---------- chrome ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-left: max(96px, env(safe-area-inset-left, 0px));
  padding-right: max(96px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap; }
.brand svg { height: 15px; width: auto; fill: var(--blue); display: block; }
.brand i { width: 1px; height: 14px; background: var(--line); }
.counter { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter b { font-weight: 400; color: var(--text); }

.menu-btn {
  position: fixed; z-index: 30; left: max(0px, env(safe-area-inset-left, 0px)); top: 50%;
  transform: translateY(-50%);
  border: 1px solid var(--line); border-left: 0; background: var(--bg); color: var(--blue);
  font: 400 11px/1 var(--font); letter-spacing: .28em; text-transform: uppercase;
  padding: 22px 13px; cursor: pointer; border-radius: 0 14px 14px 0;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  transition: background .3s, color .3s, padding .3s;
}
.menu-btn span { writing-mode: vertical-rl; transform: rotate(180deg); }
.menu-btn svg { width: 14px; height: 14px; }
.menu-btn:hover, .menu-btn:focus-visible { background: var(--blue); color: #fff; outline: none; padding-left: 17px; }

.drawer {
  position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
  width: min(440px, 92vw);
  background: var(--bg); border-right: 1px solid var(--line);
  transform: translateX(-104%); transition: transform .6s var(--ease), box-shadow .6s;
  display: flex; flex-direction: column;
  padding-top: calc(26px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(26px, env(safe-area-inset-left, 0px));
  padding-right: 22px;
}
.drawer.open { transform: translateX(0); box-shadow: 24px 0 60px rgba(15,45,87,.08); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.drawer-head h2 { font: 300 26px/1 var(--font); margin: 0; color: var(--text); }
.close {
  border: 1px solid var(--line); background: none; color: var(--blue); width: 38px; height: 38px; border-radius: 50%;
  font: 300 20px/1 var(--font); cursor: pointer; transition: background .25s, color .25s;
}
.close:hover, .close:focus-visible { background: var(--blue); color: #fff; outline: none; }
.toc { overflow-y: auto; flex: 1; margin: 0 -10px; padding: 0 10px; overscroll-behavior: contain; }
.toc-group { padding: 14px 0 10px; border-top: 1px solid var(--line); }
.toc-person { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.toc-person .ava { width: 38px; height: 38px; }
.toc-person b { font-weight: 400; font-size: 15px; color: var(--text); display: block; line-height: 1.2; }
.toc-person small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.toc a {
  display: grid; grid-template-columns: 30px 1fr; gap: 6px;
  padding: 7px 10px; margin: 0 -10px; border-radius: 10px;
  color: var(--text); text-decoration: none; font-size: 13.5px; line-height: 1.4;
  transition: background .2s;
}
.toc a span:first-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.toc a:hover, .toc a:focus-visible { background: var(--tint); outline: none; }
.toc a.current { background: var(--tint); }
.toc a.current span:first-child { color: var(--blue); font-weight: 500; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(15,45,87,.12); opacity: 0; pointer-events: none; transition: opacity .4s; }
.scrim.on { opacity: 1; pointer-events: auto; }

.meter {
  position: fixed; z-index: 20; top: 50%; transform: translateY(-50%);
  right: max(30px, calc(env(safe-area-inset-right, 0px) + 22px));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted);
}
.meter-track { width: 2px; height: 130px; background: var(--line); position: relative; overflow: hidden; border-radius: 2px; }
.meter-fill { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: var(--blue); transform-origin: top; transform: scaleY(0); transition: transform .12s linear; }
.meter-fill.up { transform-origin: bottom; }
.meter small { writing-mode: vertical-rl; }
.meter .arrow { color: var(--blue); font-size: 14px; animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateY(0) } 50% { transform: translateY(5px) } }

/* caption: centered, low, lots of air */
.cap {
  position: absolute; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; align-items: center; gap: 16px;
  font-size: 11.5px; line-height: 1; letter-spacing: .34em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; pointer-events: none;
}
.cap::before, .cap::after { content: ""; width: 32px; height: 1px; background: var(--hair); }

/* ---------- cover ---------- */
.cover-slide { justify-items: center; text-align: center; padding-block: 64px 48px; }
.cover { display: grid; justify-items: center; gap: 0; width: 100%; }
.lockup { display: flex; align-items: center; gap: clamp(16px, 2.2vw, 28px); }
.logo { height: clamp(44px, 6vw, 70px); width: auto; display: block; fill: var(--blue); overflow: visible; }
.lockup .sep { width: 1px; align-self: stretch; background: var(--hair); transform-origin: top; }
.lesson { font: 200 clamp(28px, 4.2vw, 50px)/1 var(--font); letter-spacing: .01em; color: var(--text); white-space: nowrap; }
.lesson b { font-weight: 300; color: var(--blue); }
.cover-sub { margin: 18px 0 0; font-size: 11.5px; letter-spacing: .34em; text-transform: uppercase; color: var(--muted); }
.cover-hero { width: min(470px, 86vw); aspect-ratio: 360 / 330; margin-top: clamp(4px, 1.5vh, 18px); max-height: 54vh; }
.cover-hero svg { width: 100%; height: 100%; display: block; overflow: visible; }
.is-active .logo .mark circle { animation: dotIn .7s var(--spring) backwards, dotWave 7s ease-in-out infinite; }
@keyframes dotIn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes dotWave { 0%, 82%, 100% { transform: scale(1); } 88% { transform: scale(.45); } 94% { transform: scale(1.12); } }
.is-active .logo .wm { animation: wmIn 1s var(--ease) .55s backwards; }
@keyframes wmIn { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
.is-active .lockup .sep { animation: sepIn .8s var(--ease) .8s backwards; }
@keyframes sepIn { from { transform: scaleY(0); } to { transform: none; } }
.is-active .lesson { animation: lessonIn 1s var(--ease) .9s backwards; }
@keyframes lessonIn { from { opacity: 0; transform: translateX(24px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.is-active .cover-sub { animation: fadeUp .9s ease 1.3s backwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- rules ---------- */
.rules { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(24px, 5vw, 96px); align-items: center; max-width: 1240px; margin: 0 auto; width: 100%; }
.eyebrow { font-size: 11.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; display: flex; gap: 14px; align-items: center; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--blue); }
.h1 { font: 200 clamp(32px, 3.6vw, 54px)/1.14 var(--font); margin: 0 0 30px; color: var(--text); text-wrap: balance; letter-spacing: -.005em; }
.h1 em { font-style: normal; font-weight: 400; color: var(--blue); }
.steps { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 38px 1fr; gap: 16px; align-items: start; font-size: 15px; line-height: 1.5; max-width: 52ch; color: var(--muted); }
.steps li b { display: block; font-weight: 400; font-size: 16px; color: var(--text); margin-bottom: 2px; }
.steps .n { width: 38px; height: 38px; border: 1px solid var(--blue); border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 400; color: var(--blue); }
.steps li.light .n { border-style: dashed; border-color: var(--hair); }
.is-active .steps li { animation: fadeUp .8s var(--ease) backwards; }
.is-active .steps li:nth-child(1) { animation-delay: .35s }
.is-active .steps li:nth-child(2) { animation-delay: .5s }
.is-active .steps li:nth-child(3) { animation-delay: .65s }

/* ---------- question slides ---------- */
.q-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
  gap: clamp(24px, 5vw, 96px); align-items: center; max-width: 1240px; width: 100%; margin: 0 auto;
}
.q-meta { display: flex; align-items: baseline; gap: 16px; margin-bottom: 26px; }
.q-num { font: 200 clamp(48px, 5vw, 72px)/.9 var(--font); color: var(--blue); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.q-who { font-size: 11.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
.q-who b { font-weight: 400; color: var(--text); }
.msg { display: flex; gap: 16px; align-items: flex-end; }
.ava {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  background: var(--tint); overflow: hidden; display: block; position: relative;
  box-shadow: inset 0 0 0 1px rgba(22,63,121,.08);
}
.ava svg { width: 100%; height: 100%; display: block; }
.ava { display: grid; place-items: center; }
.ava span { font-weight: 300; font-size: 26px; color: var(--blue); line-height: 1; }
.toc-person .ava span { font-size: 16px; }
.p-ava .ava { width: clamp(140px, 16vw, 200px); height: clamp(140px, 16vw, 200px); }
.p-ava .ava span { font-size: clamp(60px, 7vw, 92px); font-weight: 200; }
.is-active .p-ava .ava { animation: avaIn .9s var(--spring) .1s backwards; }
.bubble {
  position: relative; background: var(--tint); border-radius: 22px 22px 22px 6px;
  padding: 16px 22px 18px; min-width: 0; max-width: 34em;
}
.bubble .who { display: block; font-size: 13px; font-weight: 400; color: var(--blue); margin-bottom: 6px; }
.bubble .q { margin: 0; font: 300 clamp(18px, 1.6vw, 24px)/1.42 var(--font); color: var(--text); text-wrap: pretty; min-height: 1.42em; }
.bubble .q .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--blue); vertical-align: -.16em; margin-left: 2px; animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0 } }
.typing { display: inline-flex; gap: 5px; padding: 8px 0 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: tdot 1.1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
@keyframes tdot { 0%,60%,100% { transform: translateY(0); opacity: .3 } 30% { transform: translateY(-5px); opacity: 1 } }
.is-active .msg .ava { animation: avaIn .7s var(--spring) .2s backwards; }
@keyframes avaIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.is-active .msg .bubble { animation: bubIn .6s var(--spring) .35s backwards; transform-origin: 0 100%; }
@keyframes bubIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

.scene { width: 100%; max-width: 520px; justify-self: center; aspect-ratio: 4 / 3; max-height: calc(100vh - 260px); }
.scene svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ---------- person intro ---------- */
.person-slide .p-wrap { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 64px); }
.p-hero { width: clamp(220px, 26vw, 340px); aspect-ratio: 300 / 340; max-height: 62vh; }
.p-hero svg { width: 100%; height: 100%; display: block; overflow: visible; }
.p-text { display: grid; gap: 10px; }
.p-kicker { font-size: 11.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); display: flex; gap: 14px; align-items: center; }
.p-kicker::before { content: ""; width: 28px; height: 1px; background: var(--blue); }
.p-name { font: 200 clamp(48px, 6.4vw, 92px)/1 var(--font); margin: 0; color: var(--text); letter-spacing: -.01em; }
.p-role { font-size: 15px; color: var(--muted); }
.p-count { font-size: 13px; color: var(--blue); }
.is-active .p-text > * { animation: fadeUp .8s var(--ease) backwards; }
.is-active .p-text > *:nth-child(2) { animation-delay: .15s }
.is-active .p-text > *:nth-child(3) { animation-delay: .3s }
.is-active .p-text > *:nth-child(4) { animation-delay: .45s }

/* ---------- finale ---------- */
.center { display: grid; justify-items: center; text-align: center; gap: 8px; }
.end-hero { width: min(560px, 86vw); aspect-ratio: 480 / 340; max-height: 54vh; }
.end-hero svg { width: 100%; height: 100%; display: block; overflow: visible; }
.center .big { font: 200 clamp(30px, 3.6vw, 50px)/1.1 var(--font); margin: 0; color: var(--text); }
.center p { margin: 0; font-size: 15px; color: var(--muted); }
.loading { display: inline-flex; gap: 8px; margin-top: 10px; }
.loading i { width: 7px; height: 7px; background: var(--blue); border-radius: 50%; animation: tdot 1.4s ease-in-out infinite; }
.loading i:nth-child(2) { animation-delay: .2s } .loading i:nth-child(3) { animation-delay: .4s }

/* ---------- props (scene line art) ---------- */
.ink { fill: #fff; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ln { fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.thin { fill: none; stroke: var(--blue); stroke-width: 1.4; stroke-linecap: round; }
.solid { fill: var(--blue); stroke: var(--blue); stroke-width: 2.4; stroke-linejoin: round; }
.grey { fill: var(--tint); stroke: var(--blue); stroke-width: 2.4; stroke-linejoin: round; }
.veil { fill: var(--tint); }
.lbl { font: 500 12.5px var(--font); fill: var(--blue); letter-spacing: .16em; text-transform: uppercase; }
.lbl-s { font: 400 11px var(--font); fill: var(--muted); letter-spacing: .08em; }
.lbl-inv { font: 500 12.5px var(--font); fill: #fff; letter-spacing: .14em; text-transform: uppercase; }
.qbig { font: 200 230px var(--font); fill: var(--blue); }
.qsmall { font: 300 30px var(--font); fill: var(--blue); }

.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
.blink { animation: blink 4s infinite; }
@keyframes blink { 0%,94%,100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }
.spin { animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.pop { animation: pop .6s var(--spring) both; }
@keyframes pop { from { transform: scale(0); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.popl { animation: popl 3.6s var(--ease) infinite both; }
@keyframes popl { 0% { transform: scale(0); opacity: 0 } 12%,80% { transform: scale(1); opacity: 1 } 92%,100% { transform: scale(0); opacity: 0 } }
.draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 3.2s ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 400 } 45%,85% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0; opacity: 0 } }
.drawonce { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawonce 1.6s ease-out .6s forwards; }
@keyframes drawonce { to { stroke-dashoffset: 0 } }
.wipe { transform-origin: 100% 50%; animation: wipe 4s var(--ease) infinite; }
@keyframes wipe { 0%,15% { transform: scaleX(1) } 55%,85% { transform: scaleX(0) } 100% { transform: scaleX(1) } }
.twinkle { animation: twinkle 1.8s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { transform: scale(.3) rotate(0); opacity: 0 } 50% { transform: scale(1) rotate(45deg); opacity: 1 } }
.brush { animation: brush 3s ease-in-out infinite; }
@keyframes brush { 0%,100% { transform: translate(0,0) } 25% { transform: translate(40px,-14px) } 50% { transform: translate(10px,18px) } 75% { transform: translate(46px,22px) } }
.swapA { animation: swapA 3s steps(1) infinite; } .swapB { animation: swapB 3s steps(1) infinite; }
@keyframes swapA { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
@keyframes swapB { 0%,49% { opacity: 0 } 50%,100% { opacity: 1 } }
.fadeA { animation: fadeA 3.4s ease-in-out infinite; } .fadeB { animation: fadeB 3.4s ease-in-out infinite; }
@keyframes fadeA { 0%,35% { opacity: 1 } 50%,85% { opacity: 0 } 100% { opacity: 1 } }
@keyframes fadeB { 0%,35% { opacity: 0 } 50%,85% { opacity: 1 } 100% { opacity: 0 } }
.slideX { animation: slideX 2.4s linear infinite; }
@keyframes slideX { to { transform: translateX(-80px) } }
.needle { transform-origin: 50% 100%; animation: needle 3.2s var(--ease) infinite; }
@keyframes needle { 0%,15% { transform: rotate(-70deg) } 55%,85% { transform: rotate(60deg) } 100% { transform: rotate(-70deg) } }
.shrink { animation: shrink 3.2s var(--ease) infinite; transform-origin: 50% 100%; }
@keyframes shrink { 0%,15% { transform: scale(1) } 55%,85% { transform: scale(.45) } 100% { transform: scale(1) } }
.plug { animation: plug 2.6s var(--ease) infinite; }
@keyframes plug { 0%,15% { transform: translateX(-34px) } 45%,80% { transform: translateX(0) } 100% { transform: translateX(-34px) } }
.tilt { transform-origin: 50% 50%; animation: tilt 3.4s ease-in-out infinite; }
@keyframes tilt { 0%,100% { transform: rotate(-9deg) } 50% { transform: rotate(9deg) } }
.counterY { animation: counterY 3.4s ease-in-out infinite; }
@keyframes counterY { 0%,100% { transform: translateY(-14px) } 50% { transform: translateY(14px) } }
.counterY2 { animation: counterY2 3.4s ease-in-out infinite; }
@keyframes counterY2 { 0%,100% { transform: translateY(14px) } 50% { transform: translateY(-14px) } }
.flip { transform-origin: 0% 50%; animation: flip 2.4s var(--ease) infinite; }
@keyframes flip { 0%,20% { transform: scaleX(1) } 60%,100% { transform: scaleX(-1) } }
.growX { transform-origin: 0% 50%; animation: growX 3.6s var(--ease) infinite both; }
@keyframes growX { 0% { transform: scaleX(0) } 30%,85% { transform: scaleX(1) } 100% { transform: scaleX(1); opacity: 0 } }
.flow { stroke-dasharray: 5 10; animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -15 } }
.pulse { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.6); opacity: 1 } 100% { transform: scale(1.9); opacity: 0 } }
.climb { animation: climb 3.2s var(--ease) .9s both; }
@keyframes climb { 0%,8% { transform: translateY(0) } 28%,36% { transform: translateY(-38px) } 60%,68% { transform: translateY(-76px) } 92%,100% { transform: translateY(-114px) } }
.flyin1 { animation: flyin1 3.6s var(--ease) infinite; } .flyin2 { animation: flyin2 3.6s var(--ease) infinite; } .flyin3 { animation: flyin3 3.6s var(--ease) infinite; }
@keyframes flyin1 { 0%,10% { transform: translate(-90px,-60px) rotate(-30deg); opacity: 0 } 35%,85% { transform: none; opacity: 1 } 100% { opacity: 0 } }
@keyframes flyin2 { 0%,25% { transform: translate(90px,-70px) rotate(30deg); opacity: 0 } 50%,85% { transform: none; opacity: 1 } 100% { opacity: 0 } }
@keyframes flyin3 { 0%,40% { transform: translate(0,80px); opacity: 0 } 65%,85% { transform: none; opacity: 1 } 100% { opacity: 0 } }
.seek { animation: seek 5s var(--ease) infinite; }

  window.addEventListener("hashchange", () => {
    const k = slides.findIndex((s) => "#" + s.token === location.hash);
    if (k >= 0) go(k);
  });
  const start = slides.findIndex((s) => "#" + s.token === location.hash);
  go(start >= 0 ? start : 0, true);
})();
</script>
